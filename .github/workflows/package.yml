name: Сборка приложения
on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Scripts/**'
      - 'Resources/**'
      - 'Package.swift'
      - '.github/workflows/package.yml'
      - 'Docs/Установка-личной-сборки.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boggart-personal-package
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Тесты и статические проверки
        run: |
          mkdir -p build
          swift test > build/core-tests.log 2>&1 || { tail -100 build/core-tests.log; exit 1; }
          tail -12 build/core-tests.log
          python3 Scripts/audit.py
      - name: Готовое приложение и проверка XPC
        timeout-minutes: 6
        run: |
          ./Scripts/package-personal.sh > build/package.log 2>&1 || { tail -120 build/package.log; exit 1; }
          tail -80 build/package.log
      - name: Визуальная приёмка SwiftUI и привязки панели
        run: ./Scripts/capture-ui.sh > build/ui-capture.log 2>&1 || { cat build/ui-capture.log; exit 1; }
      - name: Исходники проверенной сборки
        if: always()
        run: |
          mkdir -p build
          git archive --format=zip -o build/boggart-source.zip HEAD
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: boggart-build-evidence
          path: |
            build/*.log
            build/boggart-source.zip
            build/visuals/*.png
            build/visuals/installer.DS_Store
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Boggart-0.5.3-macOS
          path: dist/*
          retention-days: 90
      - name: Публикация предварительной личной сборки
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          TAG="v${VERSION}-personal.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "Боггарт ${VERSION} — личная сборка" \
            --notes-file Docs/Установка-личной-сборки.txt
